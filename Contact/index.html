<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&family=Lobster&family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Saira+Condensed:wght@100;200;300;400;500;600;700;800;900&family=TASA+Orbiter:wght@400..800&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
   <div id="nav">
<div id="names">
        <img id="logo" src="MCCLOGO.png">
        <h1 id="name">Math & Computing Club</h1>
</div>
<div id="links">
    <a href="/">Home</a>
    <a href="/resources">Resources</a>
    <a href="/contact">Contact</a>
</div>
</div>
<section id="contact_main">
    <div id="contact_content" style="justify-content: center;">
        <div id="contact_input">
            <h1 style="color: white; margin-bottom: -20px;">Let's Get In Touch</h1>
            <p style="color: white;">Follow us on Instagram <a href="https://www.instagram.com/tfssmcc/" style="color: lightblue;">@tfssmcc</a></p>
            <form action="" class="contact_input">
                <input type="text" name="first_name" placeholder="First Name" class="contact_inputs nameInputs" required>
                <input type="text" name="last_name" placeholder="Last Name" class="contact_inputs nameInputs" required>
                <input type="email" name="school_email" placeholder="School Email" class="contact_inputs emailInput" required>
                <textarea name="message" placeholder="Inquire Message..." class="contact_inputs messageInput" required></textarea>
                <button type="submit" id="submit">Submit</button>
            </form>
        </div>
    </div>
</section>
<section id="footer">
    <div id="mfooter">
        <img id="flogo" src="logo.png">
        <h1>TFSS Math Club</h1>
    </div>
    <div id="qlinks">
        <h1>Quick Links</h1>
      <div id="linkss">
           <a href="/">Home</a>
    <a href="/resources">Resources</a>
    <a href="/contact">Contact</a>
      </div>
    </div>
    </div>
</section>
</body>
</html>
